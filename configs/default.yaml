# Global defaults. Variant configs inherit this file via `inherits` and only
# override the `model.variant` / `experiment.name` fields (plus anything else
# worth changing for that variant).

experiment:
  name: default            # overwritten by every variant config
  output_dir: outputs
  seed: 42

data:
  root: data
  connectivity_dir: connectivity   # data/connectivity/{subject_id}.npy (90x90)
  md_dir: md                       # data/md/{subject_id}.npy (90x90, analysis only)
  subjects_csv: subjects.csv       # data/subjects.csv
  stacked: false                   # true -> data/connectivity.npy (N,90,90) + data/md.npy
  preprocessing:
    symmetrize: true
    zero_diagonal: true
    normalize: per_subject_max     # per_subject_max | zscore | none

model:
  variant: transformer
  # --- Transformer ---
  d_model: 128
  n_heads: 8
  n_layers: 2
  d_ff: 256
  # --- ResNet / FCN ---
  channels: [32, 64, 128]
  # --- LSTM ---
  hidden_size: 128
  num_layers: 1
  # --- shared ---
  dropout: 0.1
  # --- enhancement modules ---
  cbam: {reduction: 16, kernel_size: 5}
  aspp: {mid_channels: 64, dilations: [6, 12, 18, 24]}
  se: {reduction: 16}
  sge: {groups: 8}

training:
  epochs: 100
  warmup_epochs: 5
  min_lr: 1.0e-6
  early_stopping_patience: 15
  amp: true
  lr: 3.0e-4
  weight_decay: 1.0e-4
  batch_size: 32
  val_fraction: 0.1        # carved out of the 80% train split (early stop / ckpt)
  num_workers: 0
  device: auto             # auto | cpu | cuda | cuda:0 ...

tuning:
  search_space:
    lr: [1.0e-5, 1.0e-3]          # log-uniform bounds (paper Section 2.4)
    weight_decay: [1.0e-6, 1.0e-3]
    batch_size: [16, 32, 64]
  n_trials_stage1: 20
  n_trials_stage2: 10
  stage2_shrink_log10: 0.5        # neighborhood around stage-1 top-3, in log10 space
  cv_folds: 10
  objective: val_acc              # val_acc | val_loss
  max_epochs_per_trial: 50        # early stopping still applies

holdout:
  n_runs: 100
  test_fraction: 0.2
  best_params: auto               # auto -> tuning/best_params.json if present, else training section
  importance:
    enabled: true
    method: permutation           # permutation | gradient
    scope: per_class              # per_class (stage-specific top-20, paper Section 3.5) | overall
    every_n_runs: 1
    max_edges: null               # null -> all 4005 upper-triangle edges

metrics:
  classes: [NC, EMCI, LMCI]

analysis:
  importance_variant: transformer_cbam   # variant whose importance defines the top-20 key connections
  top_k: 20
  mantel_permutations: 1000
  fdr_alpha: 0.05
  clinical_scores: [mmse, faq, gds]
  stages: [EMCI, LMCI]
  lasso: {cv: 10}
  shap_top_n: 12
